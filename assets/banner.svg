<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="50%" stop-color="#161b22"/>
      <stop offset="100%" stop-color="#21262d"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7928CA"/>
      <stop offset="50%" stop-color="#FF0080"/>
      <stop offset="100%" stop-color="#FF4D4D"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF0080" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#161b22" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="300" fill="url(#bg)" rx="12"/>
  
  <!-- Glowing background elements -->
  <circle cx="600" cy="150" r="220" fill="url(#glow)"/>
  
  <!-- Dynamic Background Particles / Grid lines -->
  <g opacity="0.15">
    <path d="M0,50 Q300,90 600,50 T1200,50" fill="none" stroke="#FF0080" stroke-width="2">
      <animate attributeName="d" dur="8s" repeatCount="indefinite"
        values="M0,50 Q300,90 600,50 T1200,50; M0,50 Q300,10 600,50 T1200,50; M0,50 Q300,90 600,50 T1200,50" />
    </path>
    <path d="M0,250 Q300,210 600,250 T1200,250" fill="none" stroke="#7928CA" stroke-width="2">
      <animate attributeName="d" dur="10s" repeatCount="indefinite"
        values="M0,250 Q300,210 600,250 T1200,250; M0,250 Q300,290 600,250 T1200,250; M0,250 Q300,210 600,250 T1200,250" />
    </path>
    <!-- Floating background geometric accents -->
    <circle cx="150" cy="80" r="4" fill="#FF0080">
      <animate attributeName="cy" dur="4s" repeatCount="indefinite" values="80;60;80"/>
      <animate attributeName="opacity" dur="4s" repeatCount="indefinite" values="0.3;0.8;0.3"/>
    </circle>
    <circle cx="1050" cy="220" r="6" fill="#7928CA">
      <animate attributeName="cy" dur="5s" repeatCount="indefinite" values="220;240;220"/>
      <animate attributeName="opacity" dur="5s" repeatCount="indefinite" values="0.4;0.9;0.4"/>
    </circle>
  </g>

  <!-- Title & Subtitle Group (Foreground) -->
  <g text-anchor="middle">
    <!-- Icon/Badge Top -->
    <rect x="525" y="45" width="150" height="28" rx="14" fill="#21262d" stroke="#30363d" stroke-width="1"/>
    <text x="600" y="64" fill="#58a6ff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" letter-spacing="1">🎮 AWESOME LIST</text>

    <!-- Main Title -->
    <text x="600" y="135" fill="url(#accent)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="800" letter-spacing="-0.5">Awesome Action-Adventure Video Games</text>
    
    <!-- Subtitle -->
    <text x="600" y="180" fill="#c9d1d9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="400">Curated Commercial Blockbusters &amp; Open-Source Game Engines</text>
    <text x="600" y="210" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14">Exploration • Visceral Combat • Puzzle-Solving • Immersive Storytelling</text>

    <!-- Bottom Tech Tags/Pills -->
    <g transform="translate(370, 240)">
      <rect x="0" y="0" width="130" height="26" rx="13" fill="#161b22" stroke="#FF0080" stroke-width="1" opacity="0.8"/>
      <text x="65" y="17" fill="#f0f6fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500">🗡️ Action RPGs</text>

      <rect x="150" y="0" width="140" height="26" rx="13" fill="#161b22" stroke="#7928CA" stroke-width="1" opacity="0.8"/>
      <text x="220" y="17" fill="#f0f6fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500">🧭 Open World</text>

      <rect x="305" y="0" width="155" height="26" rx="13" fill="#161b22" stroke="#58a6ff" stroke-width="1" opacity="0.8"/>
      <text x="382" y="17" fill="#f0f6fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500">⚡ Open Source Engines</text>
    </g>
  </g>
</svg>
